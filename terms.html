<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terms of Service — Fruit Slash Party</title>
<style>
:root{
  --bg:#101418;--surface:#1a2027;--text:#e8edf2;--muted:#9aabb8;--accent:#ff6b4a;--line:#2a333d;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:16px/1.7 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:0 20px}
.wrap{max-width:760px;margin:0 auto;padding:48px 0 80px}
.badge{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:4px 10px;margin-bottom:18px}
h1{font-size:30px;line-height:1.25;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;margin-bottom:36px}
nav{display:flex;gap:12px;margin-bottom:40px;flex-wrap:wrap}
nav a{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:8px;font-weight:600;transition:border-color .15s}
nav a:hover,nav a:focus-visible{border-color:var(--accent);outline:none}
h2{font-size:19px;margin:34px 0 10px;color:var(--accent)}
p,li{color:#c9d4dd;margin-bottom:12px}
ul{padding-left:22px}
strong{color:var(--text)}
footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
a{color:var(--accent)}
@media(max-width:600px){h1{font-size:24px}.wrap{padding:32px 0 60px}}
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Fruit Slash Party</span>
  <h1>Legal Documents</h1>
  <p class="sub">Grand Vision Heavy Industry Limited &middot; Last updated: November 20, 2026</p>
  <nav>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </nav>

  <section>
    <footer>© 2026 Grand Vision Heavy Industry Limited. All rights reserved.</footer>
</div>
</body>
</html>
